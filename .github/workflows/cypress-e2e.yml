# Cypress E2E Tests Workflow
# Runs Cypress end-to-end tests against a real Django development server with PostgreSQL
# This workflow:
#   - Sets up Python 3.12 and PostgreSQL
#   - Installs Django dependencies and runs migrations
#   - Starts Django dev server on port 8000
#   - Sets up Node.js 20 and installs Cypress
#   - Runs E2E tests including:
#       * sidebar_smoke.cy.js
#       * phones_scan_in_flow.cy.js
#       * phones_agent_invite_flow.cy.js
#
# Required GitHub Secrets:
#   - CYPRESS_TEST_EMAIL: Email for test user authentication
#   - CYPRESS_TEST_PASSWORD: Password for test user authentication

name: Cypress E2E

on:
  push:
    branches:
      - main
      - mobile-layout-v1
  pull_request:
    branches:
      - main
      - mobile-layout-v1

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: circuitcity
          POSTGRES_USER: ccuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U ccuser -d circuitcity"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: cc.settings
      PYTHONUNBUFFERED: 1
      POSTGRES_DB: circuitcity
      POSTGRES_USER: ccuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      # Cypress environment variables
      CYPRESS_TEST_EMAIL: ${{ secrets.CYPRESS_TEST_EMAIL }}
      CYPRESS_TEST_PASSWORD: ${{ secrets.CYPRESS_TEST_PASSWORD }}
      CYPRESS_baseUrl: http://127.0.0.1:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Start Django development server
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          echo "Django dev server started with PID $!"
          # Wait for server to be ready (max 60 seconds)
          for i in {1..60}; do
            if curl -s http://127.0.0.1:8000 > /dev/null 2>&1; then
              echo "Django server is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Django server failed to start within 60 seconds"
              exit 1
            fi
            echo "Waiting for Django server... attempt $i/60"
            sleep 1
          done

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Cypress E2E tests
        run: |
          npx cypress run

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

