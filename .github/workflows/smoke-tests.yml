# Smoke Tests Workflow
# Runs comprehensive smoke tests for all verticals on every push/PR to main
# This workflow:
#   - Sets up Python 3.12 and PostgreSQL
#   - Installs dependencies (including dev dependencies for Playwright)
#   - Creates test data for all verticals
#   - Runs Django smoke tests (fast route validation)
#   - Optionally runs Playwright E2E tests (true UI click tests)

name: Smoke Tests

on:
  push:
    branches:
      - main
      - mobile-layout-v1
  pull_request:
    branches:
      - main
      - mobile-layout-v1

jobs:
  django-smoke-tests:
    name: Django Smoke Tests (Fast)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: circuitcity
          POSTGRES_USER: ccuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U ccuser -d circuitcity"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: cc.settings
      PYTHONUNBUFFERED: 1
      POSTGRES_DB: circuitcity
      POSTGRES_USER: ccuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run Django smoke tests
        run: |
          pytest tests/smoke/ -v --tb=short -m "not e2e"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: django-smoke-test-results
          path: |
            pytest-results.xml
            htmlcov/

  # Playwright E2E tests (optional, can be enabled when needed)
  # Requires a running Django server, so we use a separate job
  playwright-smoke-tests:
    name: Playwright E2E Smoke Tests
    runs-on: ubuntu-latest
    # Uncomment to enable Playwright tests in CI
    # if: false  # Disabled by default (enable when server setup is ready)

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: circuitcity
          POSTGRES_USER: ccuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U ccuser -d circuitcity"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: cc.settings
      PYTHONUNBUFFERED: 1
      POSTGRES_DB: circuitcity
      POSTGRES_USER: ccuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      BASE_URL: http://localhost:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Create test users via management command
        run: |
          # Create test users for smoke tests
          # This would require a custom management command, e.g.:
          # python manage.py create_smoke_test_users
          echo "TODO: Create test users for E2E tests"

      - name: Start Django development server
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          sleep 5
          curl -f http://localhost:8000/ || echo "Server not ready yet"

      - name: Run Playwright smoke tests
        run: |
          pytest tests/e2e/ -v --tb=short --headed=false

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: screenshots/

      - name: Stop Django server
        if: always()
        run: |
          pkill -f "python manage.py runserver" || true

