name: Tests

on:
  push:
    branches: ["mobile-layout-v1"]
  pull_request:
    branches: ["mobile-layout-v1"]

jobs:
  Tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: cc.settings
      SECRET_KEY: test-secret-key
      DEBUG: "0"
      DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db
      SENDGRID_API_KEY: dummy
      DEFAULT_FROM_EMAIL: test@emajinet.africa
      CI: "true"
      GITHUB_ACTIONS: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install dev dependencies for pytest
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Run Django system check
        run: |
          python manage.py check

      - name: Check for missing migrations
        run: |
          python manage.py makemigrations --check

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run all tests
        run: |
          pytest -q --maxfail=1 --disable-warnings

  "Render parity (build + boot)":
    runs-on: ubuntu-latest
    needs: Tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: cc.settings
      SECRET_KEY: test-secret-key
      DEBUG: "0"
      DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db
      SENDGRID_API_KEY: dummy
      DEFAULT_FROM_EMAIL: test@emajinet.africa
      CI: "true"
      GITHUB_ACTIONS: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev build-essential curl

      - name: Run Render build script
        run: |
          chmod +x bin/render_build.sh
          bash bin/render_build.sh

      - name: Start gunicorn server
        run: |
          gunicorn cc.wsgi:application --bind 127.0.0.1:8000 --daemon
        env:
          DJANGO_SETTINGS_MODULE: cc.settings
          SECRET_KEY: test-secret-key
          DEBUG: "0"
          DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db
          SENDGRID_API_KEY: dummy
          DEFAULT_FROM_EMAIL: test@emajinet.africa
          CI: "true"
          GITHUB_ACTIONS: "true"

      - name: Wait for server to start
        run: |
          sleep 5

      - name: Check health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health/)
          if [ "$response" != "200" ]; then
            echo "Health check failed with status code: $response"
            exit 1
          fi
          echo "Health check passed with status code: $response"

