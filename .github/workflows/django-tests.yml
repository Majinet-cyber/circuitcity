# Django Tests Workflow
# Runs Django unit tests with PostgreSQL on every push/PR to main and mobile-layout-v1
# This workflow:
#   - Sets up Python 3.12
#   - Installs dependencies from requirements.txt
#   - Runs migrations against PostgreSQL
#   - Executes Django test suite

name: Django Tests

on:
  push:
    branches:
      - main
      - mobile-layout-v1
  pull_request:
    branches:
      - main
      - mobile-layout-v1

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: circuitcity
          POSTGRES_USER: ccuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U ccuser -d circuitcity"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SETTINGS_MODULE: cc.settings
      PYTHONUNBUFFERED: 1
      POSTGRES_DB: circuitcity
      POSTGRES_USER: ccuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run Django tests
        run: |
          python manage.py test

