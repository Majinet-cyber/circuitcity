{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>TengaSale Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="app-shell auth-shell">
    <div class="auth-brand">
        <div class="logo-mark">T</div>
        <h1>Tenga<span>Sale</span></h1>
        <p>Endless Possibilities</p>
    </div>

    <form method="post" class="auth-card">
        {% csrf_token %}
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        {{ form.non_field_errors }}

        <label for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}

        <label for="{{ form.password.id_for_label }}">Password</label>
        <div class="password-field">
            {{ form.password }}
            <button
                type="button"
                class="password-toggle"
                data-password-toggle
                aria-label="Show password"
                aria-controls="{{ form.password.id_for_label }}"
            >
                <svg class="password-toggle-eye" aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M2.1 12s3.6-6 9.9-6 9.9 6 9.9 6-3.6 6-9.9 6-9.9-6-9.9-6Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="password-toggle-eye-off" aria-hidden="true" viewBox="0 0 24 24" hidden>
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6A2 2 0 0 0 12 14a2 2 0 0 0 1.4-.6"></path>
                    <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.3 0 9.9 7 9.9 7a17.8 17.8 0 0 1-3.2 3.9"></path>
                    <path d="M6.7 6.7A17.2 17.2 0 0 0 2.1 12s3.6 7 9.9 7a10.6 10.6 0 0 0 4.1-.8"></path>
                </svg>
            </button>
        </div>

        <button type="submit" class="primary-button">Sign In</button>

        <a href="{% url 'password_reset' %}" class="auth-link">Forgot password?</a>
    </form>
</div>

<script>
    document.querySelectorAll("[data-password-toggle]").forEach((button) => {
        button.addEventListener("click", () => {
            const field = button.closest(".password-field");
            const input = field ? field.querySelector("input") : null;
            const eyeIcon = button.querySelector(".password-toggle-eye");
            const eyeOffIcon = button.querySelector(".password-toggle-eye-off");

            if (!input) {
                return;
            }

            const isHidden = input.type === "password";
            input.type = isHidden ? "text" : "password";
            button.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
            eyeIcon.hidden = isHidden;
            eyeOffIcon.hidden = !isHidden;
        });
    });
</script>
</body>
</html>
