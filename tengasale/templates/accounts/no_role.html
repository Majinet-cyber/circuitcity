{% extends "base/base.html" %}

{% block content %}

<section class="card complete-card">
    <h1>No role assigned</h1>
    <p class="text-muted">Your account does not have a TengaSale portal role. Ask HQ/admin to assign Merchant, Underwriter, or HQ access.</p>

        {% csrf_token %}
        <button type="submit" class="btn btn-outline">Log out</button>
    </form>
</section>

{% endblock %}
