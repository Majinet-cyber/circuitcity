<header class="topbar hq-topbar">

      <span class="hq-brand-name">TengaSale <span class="hq-brand-role">Merchant Admin</span></span>
    </a>
  </div>
  <div class="hq-topbar-right">
    <span class="hq-country-pill" title="Operating country: Malawi">
      <svg viewBox="0 0 20 14" width="18" height="13" xmlns="http://www.w3.org/2000/svg" style="border-radius:2px;flex-shrink:0;" aria-hidden="true">
        <rect width="20" height="14" fill="#339E35"/>
        <rect width="20" height="9.33" fill="#CE1126"/>
        <rect width="20" height="4.67" fill="#000000"/>
        <g transform="translate(10,4.9)">
          <circle r="2.4" fill="#000000"/><circle r="1.9" fill="#CE1126"/>
          <line x1="0" y1="-3.2" x2="0" y2="-4.2" stroke="#000" stroke-width="0.6" stroke-linecap="round"/>
          <line x1="2.26" y1="-2.26" x2="2.97" y2="-2.97" stroke="#000" stroke-width="0.6" stroke-linecap="round"/>
          <line x1="3.2" y1="0" x2="4.2" y2="0" stroke="#000" stroke-width="0.6" stroke-linecap="round"/>

          <line x1="-3.2" y1="0" x2="-4.2" y2="0" stroke="#000" stroke-width="0.6" stroke-linecap="round"/>
        </g>
      </svg>
      Malawi
    </span>
    <a href="{% url 'ticket_create' %}" class="hq-icon-btn" title="Report Issue">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    </a>
    <a href="{% url 'logout' %}" class="hq-icon-btn" title="Sign out">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </a>
