<!-- Notification Bell Icon with Dropdown -->
<div class="dropdown d-inline-block">
  <button class="btn btn-link position-relative text-decoration-none" 
          type="button" 
          id="notificationDropdown" 
          data-bs-toggle="dropdown" 
          aria-expanded="false">
    <i class="bi bi-bell fs-5"></i>
    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
          id="notif-badge" 
          style="display: none;">
      0
    </span>
  </button>
  
  <div class="dropdown-menu dropdown-menu-end shadow" style="min-width: 350px; max-height: 400px; overflow-y: auto;">
    <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
      <h6 class="mb-0">Notifications</h6>
      <a href="{% url 'notifications:mark_all_read' %}" class="small text-primary">Mark all read</a>
    </div>
    
    <div id="notif-list">
      <div class="text-center text-muted py-4">
        <i class="bi bi-bell-slash"></i>
        <p class="mb-0 small">No new notifications</p>
      </div>
    </div>
    
    <div class="text-center border-top py-2">
      <a href="{% url 'notifications:list' %}" class="small text-decoration-none">View all notifications</a>
    </div>
  </div>
</div>

<script>
(function() {
  function loadNotifications() {
    fetch('{% url "notifications:dropdown" %}')
      .then(res => res.json())
      .then(data => {
        const badge = document.getElementById('notif-badge');
        const list = document.getElementById('notif-list');
        
        // Update badge
        if (data.unread_count > 0) {
          badge.textContent = data.unread_count;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
        
        // Update list
        if (data.notifications.length === 0) {
          list.innerHTML = `
            <div class="text-center text-muted py-4">
              <i class="bi bi-bell-slash"></i>
              <p class="mb-0 small">No notifications</p>
            </div>
          `;
        } else {
          list.innerHTML = data.notifications.map(n => {
            const icon = n.level === 'success' ? 'check-circle text-success' :
                        n.level === 'warning' ? 'exclamation-triangle text-warning' :
                        n.level === 'error' ? 'x-circle text-danger' :
                        'info-circle text-info';
            const bold = n.is_read ? '' : 'fw-bold';
            
            return `
              <a href="/notifications/${n.id}/read/" class="dropdown-item ${bold} small py-2">
                <i class="bi bi-${icon} me-2"></i>
                ${n.message}
                <br>
                <small class="text-muted">${new Date(n.created_at).toLocaleString()}</small>
              </a>
            `;
          }).join('');
        }
      })
      .catch(err => console.error('Failed to load notifications:', err));
  }
  
  // Load on page load
  loadNotifications();
  
  // Reload every 60 seconds
  setInterval(loadNotifications, 60000);
})();
</script>
