<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title|default:"Page Unavailable" }} · Emajinet</title>
  <style>
    :root {
      --primary: #3b82f6;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 560px;
      background: #fff;
      border-radius: 20px;
      padding: 48px 32px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 24px;
      opacity: 0.3;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--text);
    }
    p {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.7;
    }
    .detail {
      background: var(--bg);
      border-radius: 12px;
      padding: 16px;
      margin: 24px 0;
      font-size: 0.95rem;
      color: var(--muted);
      border-left: 4px solid var(--primary);
    }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      padding: 14px 32px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      margin-top: 24px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }
    .code {
      display: inline-block;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9rem;
      color: var(--primary);
      margin: 0 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚀</div>
    <h1>{{ title|default:"This Page Has Been Upgraded" }}</h1>
    <p>{{ message|default:"This page is no longer available." }}</p>
    
    {% if detail %}
    <div class="detail">
      {{ detail }}
    </div>
    {% endif %}
    
    <p style="margin-top: 24px;">
      {% if cta_text and cta_url %}
        <a href="{{ cta_url }}" class="btn">{{ cta_text }}</a>
      {% else %}
        <a href="/" class="btn">Go to Dashboard</a>
      {% endif %}
    </p>
    
    <p style="margin-top: 32px; font-size: 0.85rem; color: var(--muted);">
      HTTP 410 Gone · This resource has been permanently removed
    </p>
  </div>
</body>
</html>
