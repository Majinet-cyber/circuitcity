<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} · Emajinet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
        }

        .error-card {
            background: white;
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .error-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
            box-shadow: 0 8px 24px rgba(251, 191, 36, 0.4);
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 1rem;
        }

        .error-message {
            color: #64748b;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .recovery-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-recovery {
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary-recovery {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        .btn-primary-recovery:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary-recovery {
            background: #f1f5f9;
            color: #475569;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary-recovery:hover {
            background: #e2e8f0;
            border-color: #cbd5e1;
        }

        .technical-details {
            margin-top: 2rem;
            padding: 1rem;
            background: #fef3c7;
            border: 2px solid #fbbf24;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #78350f;
            text-align: left;
        }

        .technical-details strong {
            display: block;
            margin-bottom: 0.5rem;
            color: #92400e;
        }

        @media (max-width: 576px) {
            .error-card {
                padding: 2rem 1.5rem;
            }

            .error-icon {
                width: 80px;
                height: 80px;
                font-size: 2.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .error-message {
                font-size: 1rem;
            }

            .btn-recovery {
                padding: 0.875rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="bi bi-shield-exclamation"></i>
        </div>

        <h1>Security Check Failed</h1>

        <div class="error-message">
            Your session may have expired or the security token is invalid.
            Don't worry — this is a safety feature to protect your account.
        </div>

        <div class="recovery-actions">
            <button onclick="window.location.reload();" class="btn-recovery btn-primary-recovery">
                <i class="bi bi-arrow-clockwise"></i>
                <span>Reload Page & Try Again</span>
            </button>

            <a href="{{ login_url }}" class="btn-recovery btn-secondary-recovery">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Go to Login</span>
            </a>
        </div>

        {% if show_reason and reason %}
        <div class="technical-details">
            <strong><i class="bi bi-info-circle"></i> Technical Details (DEBUG mode):</strong>
            <code>{{ reason }}</code>
        </div>
        {% endif %}
    </div>
</body>
</html>
