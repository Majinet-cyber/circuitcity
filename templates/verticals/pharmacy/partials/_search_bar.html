{% comment %}
Reusable Search Bar for Pharmacy
Usage: {% include "verticals/pharmacy/partials/_search_bar.html" with placeholder="Search products..." autofocus=True %}
{% endcomment %}

<div class="pharmacy-search-bar">
  <div class="search-wrapper">
    <i class="fas fa-search search-icon"></i>
    <input 
      type="text" 
      class="search-input" 
      id="{{ input_id|default:'product-search' }}"
      placeholder="{{ placeholder|default:'Search products...' }}"
      autocomplete="off"
      {% if autofocus %}autofocus{% endif %}
    >
    <button type="button" class="search-clear-btn" id="{{ input_id|default:'product-search' }}-clear" style="display:none;">
      <i class="fas fa-times"></i>
    </button>
  </div>
</div>

<style>
.pharmacy-search-bar {
  margin-bottom: 24px;
}

.search-wrapper {
  position: relative;
  width: 100%;
  max-width: 100%;
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: #94a3b8;
  font-size: 1.25rem;
  pointer-events: none;
  z-index: 2;
}

.search-input {
  width: 100%;
  padding: 16px 48px 16px 52px;
  border: 2px solid #e2e8f0;
  border-radius: 16px;
  font-size: 1.1rem;
  transition: all 0.2s ease;
  background: #fff;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
}

.search-input:focus {
  outline: none;
  border-color: #10b981;
  box-shadow: 0 6px 20px rgba(16, 185, 129, 0.15);
}

.search-clear-btn {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: #f1f5f9;
  border: none;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
  z-index: 2;
}

.search-clear-btn:hover {
  background: #e2e8f0;
}

.search-clear-btn i {
  font-size: 0.9rem;
  color: #64748b;
}

@media (max-width: 480px) {
  .search-input {
    padding: 14px 44px 14px 48px;
    font-size: 1rem;
  }
}
</style>

<script>
// Search bar interaction
(function() {
  const searchInput = document.getElementById('{{ input_id|default:"product-search" }}');
  const clearBtn = document.getElementById('{{ input_id|default:"product-search" }}-clear');
  
  if (searchInput && clearBtn) {
    searchInput.addEventListener('input', function() {
      clearBtn.style.display = this.value ? 'flex' : 'none';
    });
    
    clearBtn.addEventListener('click', function() {
      searchInput.value = '';
      searchInput.focus();
      clearBtn.style.display = 'none';
      // Trigger input event to update search results
      searchInput.dispatchEvent(new Event('input', { bubbles: true }));
    });
  }
})();
</script>
