{% comment %}
Toast Notification Component
Usage: This partial provides toast functionality via JS. Include once per page.
{% endcomment %}

<!-- Toast Container -->
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
  <div id="pharmacyToast" class="toast pharmacy-toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-body">
      <div class="toast-icon" id="toast-icon">✅</div>
      <div class="toast-message" id="toast-message">Success!</div>
    </div>
  </div>
</div>

<style>
.pharmacy-toast {
  min-width: 300px;
  border-radius: 16px;
  border: none;
  box-shadow: 0 12px 40px rgba(15, 23, 42, 0.2);
  overflow: hidden;
}

.pharmacy-toast .toast-body {
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  background: linear-gradient(135deg, #dcfce7 0%, #d1fae5 100%);
  border-left: 4px solid #10b981;
}

.pharmacy-toast.error .toast-body {
  background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
  border-left-color: #dc2626;
}

.pharmacy-toast.warning .toast-body {
  background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
  border-left-color: #f59e0b;
}

.toast-icon {
  font-size: 1.8rem;
  flex-shrink: 0;
}

.toast-message {
  flex: 1;
  font-size: 1rem;
  font-weight: 700;
  color: #0f172a;
  line-height: 1.4;
}

@media (max-width: 480px) {
  .pharmacy-toast {
    min-width: 280px;
  }
  
  .toast-icon {
    font-size: 1.5rem;
  }
  
  .toast-message {
    font-size: 0.95rem;
  }
}
</style>

<script>
// Toast notification function
function showPharmacyToast(message, type = 'success') {
  const toast = document.getElementById('pharmacyToast');
  const toastIcon = document.getElementById('toast-icon');
  const toastMessage = document.getElementById('toast-message');
  
  // Set message
  toastMessage.textContent = message;
  
  // Set icon and type
  toast.classList.remove('error', 'warning');
  if (type === 'success') {
    toastIcon.textContent = '✅';
  } else if (type === 'error') {
    toastIcon.textContent = '❌';
    toast.classList.add('error');
  } else if (type === 'warning') {
    toastIcon.textContent = '⚠️';
    toast.classList.add('warning');
  }
  
  // Show toast
  const bsToast = new bootstrap.Toast(toast, {
    autohide: true,
    delay: 3000
  });
  bsToast.show();
}

// Check for Django messages and show as toast
document.addEventListener('DOMContentLoaded', function() {
  {% if messages %}
    {% for message in messages %}
      let messageType = 'success';
      {% if message.tags %}
        {% if 'error' in message.tags or 'danger' in message.tags %}
          messageType = 'error';
        {% elif 'warning' in message.tags %}
          messageType = 'warning';
        {% endif %}
      {% endif %}
      showPharmacyToast('{{ message|escapejs }}', messageType);
    {% endfor %}
  {% endif %}
});
</script>
