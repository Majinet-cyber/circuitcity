{% extends "base.html" %}

{% block title %}Stock In · Groceries · {{ business.name }}{% endblock %}

{% block content %}
<div class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col">
      <h1 class="h3 mb-0">📦 Add Grocery Stock</h1>
      <p class="text-muted">{{ business.name }}</p>
    </div>
  </div>

  <div class="row">
    <div class="col-md-8 mx-auto">
      <div class="card">
        <div class="card-body">
          <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
              <label for="product_name" class="form-label">Product Name *</label>
              <input type="text" class="form-control" id="product_name" name="product_name" required>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" name="category">
                  {% for value, label in categories %}
                  <option value="{{ value }}">{{ label }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="unit" class="form-label">Unit</label>
                <select class="form-select" id="unit" name="unit">
                  {% for value, label in units %}
                  <option value="{{ value }}">{{ label }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label for="quantity" class="form-label">Quantity *</label>
                <input type="number" class="form-control" id="quantity" name="quantity" required min="1">
              </div>
              <div class="col-md-4 mb-3">
                <label for="cost_price" class="form-label">Cost Price (MK) *</label>
                <input type="number" class="form-control" id="cost_price" name="cost_price" required step="0.01" min="0">
              </div>
              <div class="col-md-4 mb-3">
                <label for="selling_price" class="form-label">Selling Price (MK) *</label>
                <input type="number" class="form-control" id="selling_price" name="selling_price" required step="0.01" min="0">
              </div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle"></i> Add Stock
              </button>
              <a href="{% url 'groceries:dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
