{% extends "base.html" %}

{% block title %}Add Revenue - Welding Workshop{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; padding-top: 2rem;">
  <div class="card">
    <div class="card-header">
      <h3>Add Revenue Entry</h3>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
          <label for="description" class="form-label">Description *</label>
          <input type="text" class="form-control" id="description" name="description" required>
        </div>
        
        <div class="mb-3">
          <label for="amount" class="form-label">Amount (MWK) *</label>
          <input type="number" step="0.01" class="form-control" id="amount" name="amount" required min="0.01">
        </div>
        
        <div class="mb-3">
          <label for="category" class="form-label">Category</label>
          <select class="form-control" id="category" name="category">
            <option value="consultation">Consultation</option>
            <option value="repair">Repair Work</option>
            <option value="custom_job">Custom Job</option>
            <option value="other" selected>Other</option>
          </select>
        </div>
        
        <div class="mb-3">
          <label for="received_on" class="form-label">Received On</label>
          <input type="date" class="form-control" id="received_on" name="received_on">
        </div>
        
        <div class="mb-3">
          <label for="notes" class="form-label">Notes</label>
          <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
        </div>
        
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Add Revenue</button>
          <a href="{% url 'verticals:welding_revenue' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
