{% extends "base.html" %}

{% block title %}Record Expense - {{ business.name }}{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="mb-4">
        <a href="{% url 'verticals:farm_expenses' %}" class="text-decoration-none mb-2 d-inline-block">&larr; Back to Expenses</a>
        <h1 class="h3 mb-1"><span class="me-2">💸</span>{{ hero_title }}</h1>
    </div>
    
    <div class="card" style="max-width: 600px;">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" class="form-control" value="{{ today|date:'Y-m-d' }}">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-select" required>
                        {% for value, label in expense_categories %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <input type="text" name="description" class="form-control" placeholder="e.g., 50kg fertilizer" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Amount (MWK)</label>
                    <input type="number" name="amount" class="form-control" step="0.01" min="0" required>
                </div>
                
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label">Quantity</label>
                        <input type="number" name="quantity" class="form-control" step="0.01" min="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Unit</label>
                        <select name="unit" class="form-select">
                            {% for value, label in units %}
                            <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Payment Method</label>
                    <select name="payment_method" class="form-select">
                        {% for value, label in payment_methods %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Notes (optional)</label>
                    <textarea name="notes" class="form-control" rows="2"></textarea>
                </div>
                
                <button type="submit" class="btn btn-danger w-100">
                    <i class="bi bi-check-lg me-1"></i> Record Expense
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
