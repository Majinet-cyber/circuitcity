{% extends "base.html" %}

{% block title %}Add Livestock Event - Farm Manager{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/verticals/farm/dashboard/">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/verticals/farm/livestock/">Livestock</a></li>
            <li class="breadcrumb-item active">Add Event</li>
        </ol>
    </nav>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-calendar-event"></i> Add Livestock Event</h5>
        </div>
        <div class="card-body">
            <form method="post" data-testid="farm-livestock-event-form">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="batch_id" class="form-label">Batch *</label>
                    <select class="form-select" id="batch_id" name="batch_id" required>
                        <option value="">Select a batch...</option>
                        {% for batch in batches %}
                        <option value="{{ batch.id }}">{{ batch.name }} ({{ batch.get_animal_type_display }} - {{ batch.count_current }} current)</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="event_type" class="form-label">Event Type *</label>
                    <select class="form-select" id="event_type" name="event_type" required>
                        {% for value, label in event_types %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" class="form-control" id="date" name="date">
                </div>

                <div class="mb-3">
                    <label for="count" class="form-label">Number of Animals *</label>
                    <input type="number" class="form-control form-control-lg" id="count" name="count" 
                           min="1" required autofocus>
                </div>

                <div class="mb-3" id="price-field">
                    <label for="unit_price" class="form-label">Price per Animal (MWK)</label>
                    <input type="number" class="form-control" id="unit_price" name="unit_price" 
                           step="0.01" min="0" placeholder="For purchases/sales">
                </div>

                <div class="mb-3">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="2"></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg" data-testid="farm-livestock-event-submit">
                        <i class="bi bi-check-circle"></i> Record Event
                    </button>
                    <a href="/verticals/farm/livestock/" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Show/hide price field based on event type
document.getElementById('event_type').addEventListener('change', function() {
    var priceField = document.getElementById('price-field');
    if (['purchase', 'sale'].includes(this.value)) {
        priceField.style.display = 'block';
    } else {
        priceField.style.display = 'none';
    }
});
</script>
{% endblock %}
