{% extends "base.html" %}

{% block title %}New Crop Season - Farm Manager{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/verticals/farm/dashboard/">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/verticals/farm/crops/">Crops</a></li>
            <li class="breadcrumb-item active">New Season</li>
        </ol>
    </nav>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0"><i class="bi bi-flower1"></i> Create Crop Season</h5>
        </div>
        <div class="card-body">
            <form method="post" data-testid="farm-season-form">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="name" class="form-label">Season Name *</label>
                    <input type="text" class="form-control" id="name" name="name" 
                           placeholder="e.g., Maize 2026 Main Season" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="crop_type" class="form-label">Crop Type *</label>
                    <select class="form-select" id="crop_type" name="crop_type" required>
                        {% for value, label in crop_types %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label for="start_date" class="form-label">Start Date *</label>
                        <input type="date" class="form-control" id="start_date" name="start_date" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label for="end_date" class="form-label">End Date</label>
                        <input type="date" class="form-control" id="end_date" name="end_date">
                    </div>
                </div>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label for="area_value" class="form-label">Area *</label>
                        <input type="number" class="form-control" id="area_value" name="area_value" 
                               step="0.01" min="0.01" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label for="area_unit" class="form-label">Unit</label>
                        <select class="form-select" id="area_unit" name="area_unit">
                            <option value="acre">Acres</option>
                            <option value="ha">Hectares</option>
                        </select>
                    </div>
                </div>

                <hr>
                <h6 class="text-muted mb-3">Projections (Optional)</h6>

                <div class="row">
                    <div class="col-6 mb-3">
                        <label for="projected_yield" class="form-label">Expected Yield</label>
                        <input type="number" class="form-control" id="projected_yield" name="projected_yield" 
                               step="0.01" min="0">
                    </div>
                    <div class="col-6 mb-3">
                        <label for="yield_unit" class="form-label">Yield Unit</label>
                        <select class="form-select" id="yield_unit" name="yield_unit">
                            <option value="bag">Bags (50kg)</option>
                            <option value="kg">Kilograms</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="projected_price" class="form-label">Expected Price per Unit (MWK)</label>
                    <input type="number" class="form-control" id="projected_price" name="projected_price" 
                           step="0.01" min="0" placeholder="e.g., 25000">
                </div>

                <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" name="status">
                        {% for value, label in status_choices %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="2"></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="bi bi-check-circle"></i> Create Season
                    </button>
                    <a href="/verticals/farm/crops/" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
