{% extends "base.html" %}
{% load humanize %}

{% block title %}Add Maintenance - Car Hire - {{ business.name }}{% endblock %}

{% block extra_css %}
<style>
.add-maintenance-page {
    --hire-primary: #059669;
    max-width: 600px;
    margin: 0 auto;
}

.page-header { margin-bottom: 1.5rem; }
.page-title {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.page-title i { color: var(--hire-primary); }

.form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
}

.form-group { margin-bottom: 1.25rem; }
.form-label {
    display: block;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 0.375rem;
}
.form-label .required { color: #dc2626; }

.form-input, .form-select {
    width: 100%;
    padding: 0.625rem 0.875rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 0.9375rem;
    background: var(--surface);
}
.form-input:focus, .form-select:focus {
    outline: none;
    border-color: var(--hire-primary);
    box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
}

.form-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
}
@media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

.btn-submit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
    padding: 0.75rem 1.5rem;
    background: var(--hire-primary);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
}
.btn-submit:hover { background: #047857; }

.back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.875rem;
    margin-bottom: 1rem;
}
.back-link:hover { color: var(--ink); }
</style>
{% endblock %}

{% block content %}
<div class="add-maintenance-page">
    <a href="/verticals/car_hire/maintenance/" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Maintenance
    </a>
    
    <div class="page-header">
        <h1 class="page-title">
            <i class="fas fa-plus-circle"></i>
            Add Maintenance Record
        </h1>
    </div>
    
    <form method="post" class="form-card">
        {% csrf_token %}
        
        <div class="form-group">
            <label class="form-label">Vehicle <span class="required">*</span></label>
            <select name="vehicle_id" class="form-select" required>
                <option value="">Select vehicle...</option>
                {% for vehicle in vehicles %}
                <option value="{{ vehicle.id }}">{{ vehicle.display_name }} ({{ vehicle.plate_number }})</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Maintenance Type <span class="required">*</span></label>
                <select name="maintenance_type" class="form-select" required>
                    {% for value, label in MaintenanceType.choices %}
                    <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Date <span class="required">*</span></label>
                <input type="date" name="date" class="form-input" required>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label">Description <span class="required">*</span></label>
            <textarea name="description" class="form-input" rows="3" placeholder="Describe the work done..." required></textarea>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Cost (MK)</label>
                <input type="number" name="cost" class="form-input" placeholder="0" min="0" step="100" value="0">
            </div>
            <div class="form-group">
                <label class="form-label">Odometer (km)</label>
                <input type="number" name="odometer" class="form-input" placeholder="Current reading" min="0">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Vendor / Garage</label>
                <input type="text" name="vendor" class="form-input" placeholder="e.g., ABC Motors">
            </div>
            <div class="form-group">
                <label class="form-label">Next Service (km)</label>
                <input type="number" name="next_maintenance_km" class="form-input" placeholder="e.g., 55000" min="0">
            </div>
        </div>
        
        <button type="submit" class="btn-submit">
            <i class="fas fa-check"></i> Save Record
        </button>
    </form>
</div>
{% endblock %}
