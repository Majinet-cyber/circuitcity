{% extends "base.html" %}

{% block title %}Select a Business Type · Circuit City{% endblock %}

{% block content %}
{% url 'accounts:settings_unified' as settings_url %}
<style>
  .vertical-page{min-height:60vh;display:grid;place-items:center;padding:24px}
  .no-business-card{max-width:520px;background:#fff;border-radius:24px;padding:32px;text-align:center;box-shadow:0 20px 50px rgba(15,23,42,.1)}
  .no-business-card h1{margin:0 0 12px;font-size:clamp(24px,3vw,32px)}
  .no-business-card p{margin:0 0 18px;color:#475569}
  .no-business-card a{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:#2563eb;color:#fff;text-decoration:none;font-weight:700}
</style>

<section class="vertical-page">
  <div class="no-business-card">
    <h1>{{ hero_title }}</h1>
    <p>{{ hero_blurb }}</p>
    <a href="{{ settings_url|default:'/accounts/settings/' }}">
      <i class="bi bi-sliders"></i>Open business settings
    </a>
  </div>
</section>
{% endblock %}
