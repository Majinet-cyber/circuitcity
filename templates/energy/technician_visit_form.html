{% extends "base.html" %}
{% load static %}

{% block title %}Schedule Visit – {{ business.name }}{% endblock %}

{% block content %}
<div class="container-fluid py-4" style="max-width:680px;">
  <h4 class="fw-bold mb-4"><i class="bi bi-calendar-plus me-2" style="color:#6366f1;"></i>Schedule Technician Visit</h4>

  {% if messages %}{% for m in messages %}<div class="alert alert-{{ m.tags|default:'info' }} rounded-3 mb-3">{{ m }}</div>{% endfor %}{% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="card border-0 shadow-sm rounded-4 p-4">
      <div class="mb-3">
        <label class="form-label fw-semibold">Site *</label>
        <select name="site" class="form-select rounded-3" required>
          <option value="">— Select site —</option>
          {% for s in sites %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Visit Type</label>
        <select name="visit_type" class="form-select rounded-3">
          <option value="maintenance">Scheduled Maintenance</option>
          <option value="repair">Repair / Fault Response</option>
          <option value="inspection">Inspection / Audit</option>
          <option value="installation">Installation</option>
          <option value="commissioning">Commissioning</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Scheduled Date *</label>
        <input type="date" name="scheduled_date" class="form-control rounded-3" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Description</label>
        <textarea name="description" class="form-control rounded-3" rows="3" placeholder="What needs to be done..."></textarea>
      </div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{% url 'verticals:energy_technicians' %}" class="btn btn-outline-secondary rounded-pill">Cancel</a>
        <button type="submit" class="btn btn-success rounded-pill px-4"><i class="bi bi-check-lg me-1"></i>Schedule</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
