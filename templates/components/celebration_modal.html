<!-- PHASE 5: Celebration Modal Component -->
<!-- Shows after sale with XP, level ups, badges, and streak milestones -->

<style>
/* Celebration Modal */
.celebration-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.3s}
.celebration-modal.show{display:flex}

.celebration-content{background:#fff;border-radius:24px;max-width:450px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1)}

.celebration-header{padding:32px 24px 24px;text-align:center;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border-radius:24px 24px 0 0;position:relative;overflow:hidden}
.celebration-header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 70%);animation:pulse 2s infinite}

.celebration-emoji{font-size:72px;margin-bottom:16px;display:block;animation:bounce 0.6s ease}
.celebration-title{font-size:28px;font-weight:800;margin:0 0 8px;text-shadow:0 2px 8px rgba(0,0,0,0.2)}
.celebration-subtitle{font-size:14px;opacity:0.95;margin:0}

.celebration-body{padding:24px}

/* XP Card */
.celebration-xp-card{background:linear-gradient(135deg,#fef3c7,#fde68a);padding:20px;border-radius:16px;margin-bottom:16px;text-align:center}
.celebration-xp-value{font-size:48px;font-weight:900;color:#92400e;margin:0 0 8px;line-height:1}
.celebration-xp-label{font-size:14px;font-weight:600;color:#78350f;text-transform:uppercase;letter-spacing:0.05em}
.celebration-level-badge{background:#fff;display:inline-block;padding:8px 16px;border-radius:12px;font-weight:700;color:#92400e;margin-top:12px;box-shadow:0 2px 8px rgba(146,64,14,0.2)}

/* Level Up Animation */
.celebration-level-up{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;padding:24px;border-radius:16px;margin-bottom:16px;text-align:center;position:relative;overflow:hidden}
.celebration-level-up::before{content:'✨';position:absolute;font-size:120px;top:50%;left:50%;transform:translate(-50%,-50%);opacity:0.1}
.celebration-level-up-text{font-size:20px;font-weight:700;margin:0 0 8px;position:relative;z-index:1}
.celebration-level-up-levels{font-size:32px;font-weight:900;position:relative;z-index:1}

/* Badges */
.celebration-badges{background:#f8fafc;padding:16px;border-radius:16px;margin-bottom:16px}
.celebration-badges-title{font-size:14px;font-weight:700;color:#0f172a;margin:0 0 12px;text-transform:uppercase;letter-spacing:0.05em}
.celebration-badge-item{background:#fff;padding:16px;border-radius:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:2px solid #e2e8f0;box-shadow:0 2px 8px rgba(15,23,42,0.06)}
.celebration-badge-item:last-child{margin-bottom:0}
.celebration-badge-icon{font-size:36px}
.celebration-badge-info{flex:1}
.celebration-badge-name{font-weight:700;color:#0f172a;margin:0 0 4px;font-size:16px}
.celebration-badge-desc{font-size:12px;color:#64748b;margin:0}

/* Streak */
.celebration-streak{background:linear-gradient(135deg,#fee2e2,#fecaca);padding:16px;border-radius:16px;text-align:center;margin-bottom:16px}
.celebration-streak-icon{font-size:48px;margin-bottom:8px}
.celebration-streak-text{font-size:18px;font-weight:700;color:#991b1b;margin:0}

/* Close Button */
.celebration-close{width:100%;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;padding:16px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.3s;margin-top:8px}
.celebration-close:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(5,150,105,0.3)}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:0.5}}

/* Confetti */
.confetti{position:absolute;width:10px;height:10px;background:#f59e0b;animation:confetti-fall 3s linear}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>

<!-- Modal HTML (hidden by default, shown via JS) -->
<div id="celebrationModal" class="celebration-modal">
  <div class="celebration-content">
    <div class="celebration-header">
      <span class="celebration-emoji">🎉</span>
      <h2 class="celebration-title">Awesome Sale!</h2>
      <p class="celebration-subtitle">You're crushing it today</p>
    </div>
    
    <div class="celebration-body">
      <!-- XP Earned -->
      <div id="celebrationXPCard" class="celebration-xp-card">
        <div class="celebration-xp-value" id="celebrationXPValue">+0</div>
        <div class="celebration-xp-label">Experience Points</div>
        <div class="celebration-level-badge" id="celebrationLevelBadge">Level 1</div>
      </div>
      
      <!-- Level Up (conditionally shown) -->
      <div id="celebrationLevelUp" class="celebration-level-up" style="display:none">
        <div class="celebration-level-up-text">🎊 Level Up!</div>
        <div class="celebration-level-up-levels"><span id="celebrationOldLevel">1</span> → <span id="celebrationNewLevel">2</span></div>
      </div>
      
      <!-- New Badges (conditionally shown) -->
      <div id="celebrationBadges" class="celebration-badges" style="display:none">
        <div class="celebration-badges-title">🏆 New Badges Unlocked!</div>
        <div id="celebrationBadgesList"></div>
      </div>
      
      <!-- Streak Milestone (conditionally shown) -->
      <div id="celebrationStreak" class="celebration-streak" style="display:none">
        <div class="celebration-streak-icon">🔥</div>
        <div class="celebration-streak-text"><span id="celebrationStreakDays">0</span> Day Streak!</div>
      </div>
      
      <button class="celebration-close" onclick="closeCelebrationModal()">Continue</button>
    </div>
  </div>
</div>

<script>
// Show celebration modal with gamification data
function showCelebrationModal(gamificationData) {
  if (!gamificationData || !gamificationData.show_celebration) {
    return; // Don't show if not a celebration-worthy event
  }
  
  const modal = document.getElementById('celebrationModal');
  
  // Update XP
  document.getElementById('celebrationXPValue').textContent = '+' + gamificationData.xp_gained;
  document.getElementById('celebrationLevelBadge').textContent = 'Level ' + gamificationData.level;
  
  // Level Up
  if (gamificationData.level_up) {
    document.getElementById('celebrationLevelUp').style.display = 'block';
    document.getElementById('celebrationOldLevel').textContent = gamificationData.old_level;
    document.getElementById('celebrationNewLevel').textContent = gamificationData.level;
  } else {
    document.getElementById('celebrationLevelUp').style.display = 'none';
  }
  
  // Badges
  if (gamificationData.badges_earned && gamificationData.badges_earned.length > 0) {
    document.getElementById('celebrationBadges').style.display = 'block';
    const badgesList = document.getElementById('celebrationBadgesList');
    badgesList.innerHTML = '';
    gamificationData.badges_earned.forEach(badge => {
      const badgeHTML = `
        <div class="celebration-badge-item">
          <div class="celebration-badge-icon">${badge.icon}</div>
          <div class="celebration-badge-info">
            <div class="celebration-badge-name">${badge.name}</div>
            <div class="celebration-badge-desc">${badge.description}</div>
          </div>
        </div>
      `;
      badgesList.insertAdjacentHTML('beforeend', badgeHTML);
    });
  } else {
    document.getElementById('celebrationBadges').style.display = 'none';
  }
  
  // Streak
  if (gamificationData.streak_days > 0 && gamificationData.streak_days % 7 === 0) {
    document.getElementById('celebrationStreak').style.display = 'block';
    document.getElementById('celebrationStreakDays').textContent = gamificationData.streak_days;
  } else {
    document.getElementById('celebrationStreak').style.display = 'none';
  }
  
  // Show modal
  modal.classList.add('show');
  
  // Add confetti
  createConfetti();
}

function closeCelebrationModal() {
  document.getElementById('celebrationModal').classList.remove('show');
}

function createConfetti() {
  const colors = ['#f59e0b', '#10b981', '#8b5cf6', '#f97316', '#ec4899'];
  const header = document.querySelector('.celebration-header');
  for (let i = 0; i < 30; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.animationDelay = Math.random() * 0.5 + 's';
    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
    header.appendChild(confetti);
    setTimeout(() => confetti.remove(), 3000);
  }
}
</script>
