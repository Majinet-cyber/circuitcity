<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>New Business - Emajinet</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h1 style="color: #f59e0b;">🏪 New Business Created!</h1>
        <p>A new business has been created on Emajinet:</p>
        <ul>
            <li><strong>Business Name:</strong> {{ business_name }}</li>
            <li><strong>Type:</strong> {{ business_kind }}</li>
            <li><strong>Owner:</strong> {{ owner_name }} ({{ owner_email }})</li>
        </ul>
        <p><a href="https://emajinet.africa/hq/" style="color: #f59e0b;">View in HQ Dashboard</a></p>
        <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;">
        <p style="font-size: 0.875rem; color: #666;">Emajinet Platform - Owner Alert</p>
    </div>
</body>
</html>
