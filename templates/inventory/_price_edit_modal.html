{% comment %}
PHASE 4: Price Edit Modal for Unsold Items (Manager-only)
Include this in stock list pages
{% endcomment %}

<!-- Edit Prices Modal -->
<div id="editPricesModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:white; border-radius:12px; padding:24px; max-width:500px; width:90%; max-height:90vh; overflow-y:auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="margin:0; font-size:20px; font-weight:600;">Edit Prices</h2>
      <button onclick="closeEditPricesModal()" style="background:none; border:none; font-size:24px; cursor:pointer; color:#64748b;">&times;</button>
    </div>
    
    <form id="editPricesForm" onsubmit="event.preventDefault(); submitEditPrices();">
      <input type="hidden" id="editItemId">
      
      <!-- Current Values -->
      <div style="background:#f1f5f9; border-radius:8px; padding:12px; margin-bottom:16px;">
        <div style="font-size:13px; color:#64748b; margin-bottom:8px;">Current Values</div>
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
          <span style="font-weight:500;">Cost (Order Price):</span>
          <span id="editCurrentOrderPrice" style="font-weight:600; color:#0f172a;">K0.00</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
          <span style="font-weight:500;">Selling Price:</span>
          <span id="editCurrentSellingPrice" style="font-weight:600; color:#0f172a;">K0.00</span>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="font-weight:500;">IMEI:</span>
          <span id="editItemIMEI" style="font-family:monospace; color:#64748b;">-</span>
        </div>
      </div>
      
      <!-- New Order Price -->
      <div style="margin-bottom:16px;">
        <label for="editOrderPrice" style="display:block; margin-bottom:6px; font-weight:500; font-size:14px;">
          New Cost (Order Price)
        </label>
        <input 
          type="number" 
          id="editOrderPrice" 
          step="0.01" 
          min="0"
          placeholder="Leave blank to keep unchanged"
          style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px;"
        >
      </div>
      
      <!-- New Selling Price -->
      <div style="margin-bottom:16px;">
        <label for="editSellingPrice" style="display:block; margin-bottom:6px; font-weight:500; font-size:14px;">
          New Selling Price
        </label>
        <input 
          type="number" 
          id="editSellingPrice" 
          step="0.01" 
          min="0"
          placeholder="Leave blank to keep unchanged"
          style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px;"
        >
      </div>
      
      <!-- Reason -->
      <div style="margin-bottom:20px;">
        <label for="editReason" style="display:block; margin-bottom:6px; font-weight:500; font-size:14px;">
          Reason for Change <span style="color:#ef4444;">*</span>
        </label>
        <textarea 
          id="editReason" 
          required
          minlength="5"
          rows="3"
          placeholder="Why are you changing these prices? (min 5 characters)"
          style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; resize:vertical;"
        ></textarea>
        <div style="font-size:12px; color:#64748b; margin-top:4px;">
          This will be recorded in the audit log
        </div>
      </div>
      
      <!-- Actions -->
      <div style="display:flex; gap:12px; justify-content:flex-end;">
        <button 
          type="button" 
          onclick="closeEditPricesModal()"
          style="padding:10px 20px; border:1px solid #cbd5e1; background:white; border-radius:8px; cursor:pointer; font-weight:500;"
        >
          Cancel
        </button>
        <button 
          type="submit"
          id="editPricesSubmitBtn"
          style="padding:10px 20px; border:none; background:#2563eb; color:white; border-radius:8px; cursor:pointer; font-weight:500;"
        >
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
