<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting · Sell Phone</title>
  <meta http-equiv="refresh" content="0;url={{ redirect_url }}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f8fafc;
      color: #0f172a;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 32px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      max-width: 480px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 16px; }
    p { color: #64748b; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: #3b82f6;
      color: #fff;
      padding: 12px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 24px auto;
      border: 4px solid #e2e8f0;
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Redirecting to {{ canonical_name|default:"Phone Sale Wizard" }}</h1>
    <p>Taking you to the new gamified sale flow...</p>
    <a href="{{ redirect_url }}" class="btn">Continue →</a>
  </div>
  <script>
    // JavaScript redirect (fallback to meta refresh above)
    setTimeout(() => {
      window.location.href = "{{ redirect_url }}";
    }, 100);
  </script>
</body>
</html>
