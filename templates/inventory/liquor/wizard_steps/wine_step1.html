<!-- Wine Step 1: Quantity (Bottle-based, sold by glass) -->
<div class="step-header">
  <div class="step-icon">🍷</div>
  <div class="step-title">
    <h2>Step 1: Quantity</h2>
    <div class="step-subtitle">Enter number of bottles purchased</div>
  </div>
</div>

<div id="error-message" class="error-message"></div>

<div class="form-group">
  <label class="form-label">
    Number of Bottles <span class="required">*</span>
  </label>
  <input type="number" class="form-control form-control-lg" id="bottles" name="bottles" min="1" required>
  <div class="form-hint">1 bottle = 5 glasses (stock in by bottle, sell by glass)</div>
</div>

<div style="background: #fef3c7; border-left: 4px solid #f59e0b; padding: 1rem; border-radius: 4px; margin-top: 1.5rem;">
  <p style="margin: 0; font-size: 0.95rem; color: #78350f;">
    <strong>ℹ️ Note:</strong> Wine is stocked by bottles but sold by glass. Each bottle yields 5 glasses for serving.
  </p>
</div>
