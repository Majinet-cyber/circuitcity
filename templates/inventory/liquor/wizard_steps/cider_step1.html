<!-- Cider Step 1: Quantity (Bottle-based) -->
<div class="step-header">
  <div class="step-icon">🍎</div>
  <div class="step-title">
    <h2>Step 1: Quantity</h2>
    <div class="step-subtitle">Enter number of bottles</div>
  </div>
</div>

<div id="error-message" class="error-message"></div>

<div class="form-group">
  <label class="form-label">
    Number of Bottles <span class="required">*</span>
  </label>
  <input type="number" class="form-control form-control-lg" id="quantity_bottles" name="quantity_bottles" min="1" required>
  <div class="form-hint">Total bottles to add to stock</div>
</div>
