<!-- Beer Step 2: Costs -->
<div class="step-header">
  <div class="step-icon">💰</div>
  <div class="step-title">
    <h2>Step 2: Costs</h2>
    <div class="step-subtitle">Enter cost per crate</div>
  </div>
</div>

<div id="error-message" class="error-message"></div>

<div class="form-group">
  <label class="form-label">
    Cost per Crate (MWK) <span class="required">*</span>
  </label>
  <input type="number" class="form-control form-control-lg" id="cost_per_crate" name="cost_per_crate" step="0.01" min="0.01" required>
  <div class="form-hint">Server will calculate cost per bottle automatically</div>
</div>

<div style="background: #f0f9ff; border-left: 4px solid #0ea5e9; padding: 1rem; border-radius: 4px; margin-top: 1.5rem;">
  <p style="margin: 0; font-size: 0.95rem; color: #0c4a6e;">
    <strong>💡 Calculation Preview:</strong><br>
    Cost per bottle = (Total crate cost + loose cost) ÷ Total bottles<br>
    Loose cost = (Cost per crate ÷ 20) × Loose bottles
  </p>
</div>
