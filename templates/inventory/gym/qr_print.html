<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - {{ member.name }}</title>
    <style>
        @media print {
            @page {
                size: A4;
                margin: 20mm;
            }
            body {
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none;
            }
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f8fafc;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 60px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #1e293b;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .gym-number {
            color: #667eea;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 40px;
            letter-spacing: 0.05em;
        }
        .qr-code {
            margin: 40px auto;
            padding: 20px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            display: inline-block;
        }
        .qr-code img {
            width: 320px;
            height: 320px;
            display: block;
        }
        .print-button {
            margin-top: 30px;
            padding: 14px 28px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
        }
        .print-button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ member.name }}</h1>
        <div class="gym-number">{{ member.member_number|default:member.member_code|default:"N/A" }}</div>

        <div class="qr-code">
            <img src="{{ qr_image_url }}" alt="QR Code for {{ member.name }}">
        </div>

        <button onclick="window.print()" class="print-button no-print">Print QR Code</button>
    </div>
</body>
</html>
