{% extends "base.html" %}
{% load static %}

{% block title %}Add Clothing Product · Wizard{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/wizard-system.css' %}">
{% endblock %}

{% block content %}
<div id="wizard-container"></div>

<script src="{% static 'js/wizard-engine.js' %}"></script>
<script>
(function() {
  // Clothing categories
  const categories = [
    { value: 'shoes', label: 'Shoes', icon: '👟' },
    { value: 'suits', label: 'Suits', icon: '🤵' },
    { value: 'shirts', label: 'Shirts', icon: '👔' },
    { value: 'tshirts', label: 'T-Shirts', icon: '👕' },
    { value: 'jeans', label: 'Jeans', icon: '👖' },
    { value: 'trousers', label: 'Trousers', icon: '👖' },
    { value: 'jackets', label: 'Jackets', icon: '🧥' },
    { value: 'dresses', label: 'Dresses', icon: '👗' },
    { value: 'skirts', label: 'Skirts', icon: '👗' },
    { value: 'sweaters', label: 'Sweaters', icon: '🧶' },
    { value: 'other', label: 'Other', icon: '📦' }
  ];

  // Shoe subtypes
  const shoeSubtypes = [
    { value: 'dress', label: 'Dress Shoes', icon: '👞' },
    { value: 'sports', label: 'Sports Shoes', icon: '👟', featured: true },
    { value: 'sneakers', label: 'Sneakers', icon: '👟', featured: true },
    { value: 'boots', label: 'Boots', icon: '🥾' },
    { value: 'slip_on', label: 'Slip-on', icon: '🥿' },
    { value: 'sandals', label: 'Sandals', icon: '👡' },
    { value: 'formal', label: 'Formal', icon: '👞' },
    { value: 'casual', label: 'Casual', icon: '👟' },
    { value: 'other', label: 'Other', icon: '👟' }
  ];

  // Sports shoe brands
  const sportsBrands = [
    { value: 'Jordan', label: 'Jordan', icon: '🏀', badge: 'Premium' },
    { value: 'Nike', label: 'Nike', icon: '✓', featured: true },
    { value: 'Adidas', label: 'Adidas', icon: '⚽' },
    { value: 'Puma', label: 'Puma', icon: '🐆' },
    { value: 'Air Force', label: 'Air Force', icon: '✈️' },
    { value: 'Air Max', label: 'Air Max', icon: '💨' },
    { value: 'Converse', label: 'Converse', icon: '⭐' },
    { value: 'Vans', label: 'Vans', icon: '🛹' }
  ];

  // Jordan models
  const jordanModels = [
    { value: 'Air 1', label: 'Jordan Air 1', icon: '👟' },
    { value: 'Air 4', label: 'Jordan Air 4', icon: '👟' },
    { value: 'Air 6', label: 'Jordan Air 6', icon: '👟' },
    { value: 'Retro', label: 'Jordan Retro', icon: '👟' }
  ];

  // Suit subtypes
  const suitSubtypes = [
    { value: 'two_piece', label: 'Two-piece', icon: '🤵' },
    { value: 'three_piece', label: 'Three-piece', icon: '🤵', badge: 'Classic' },
    { value: 'casual', label: 'Casual suit', icon: '👔' },
    { value: 'formal', label: 'Formal suit', icon: '🤵' },
    { value: 'wedding', label: 'Wedding suit', icon: '💒', badge: 'Special' },
    { value: 'office', label: 'Office suit', icon: '💼' },
    { value: 'other', label: 'Other', icon: '👔' }
  ];

  // Suit fits
  const suitFits = [
    { value: 'slim', label: 'Slim', icon: '📏' },
    { value: 'regular', label: 'Regular', icon: '📏', featured: true },
    { value: 'loose', label: 'Loose', icon: '📏' }
  ];

  // Jeans types
  const jeansTypes = [
    { value: 'soft_denim', label: 'Soft Denim', icon: '👖' },
    { value: 'english_denim', label: 'English Denim', icon: '👖' },
    { value: 'skinny', label: 'Skinny', icon: '👖' },
    { value: 'straight', label: 'Straight', icon: '👖', featured: true },
    { value: 'bootcut', label: 'Bootcut', icon: '👖' },
    { value: 'stretch', label: 'Stretch', icon: '👖' },
    { value: 'other', label: 'Other', icon: '👖' }
  ];

  // Colors
  const colors = [
    { value: 'blue', label: 'Blue', icon: '🔵' },
    { value: 'black', label: 'Black', icon: '⚫' },
    { value: 'grey', label: 'Grey', icon: '⚪' },
    { value: 'light_wash', label: 'Light wash', icon: '💙' },
    { value: 'dark_wash', label: 'Dark wash', icon: '🔷' }
  ];

  // Sizes
  const sizes = [
    { value: 'S', label: 'S', icon: '📏' },
    { value: 'M', label: 'M', icon: '📏', featured: true },
    { value: 'L', label: 'L', icon: '📏', featured: true },
    { value: 'XL', label: 'XL', icon: '📏' },
    { value: 'XXL', label: 'XXL', icon: '📏' },
    { value: 'XXXL', label: 'XXXL', icon: '📏' }
  ];

  // Numeric sizes
  const numericSizes = [
    { value: '28', label: '28', icon: '📐' },
    { value: '30', label: '30', icon: '📐' },
    { value: '32', label: '32', icon: '📐', featured: true },
    { value: '34', label: '34', icon: '📐', featured: true },
    { value: '36', label: '36', icon: '📐' },
    { value: '38', label: '38', icon: '📐' },
    { value: '40', label: '40', icon: '📐' },
    { value: '42', label: '42', icon: '📐' },
    { value: '44', label: '44', icon: '📐' }
  ];

  // Genders
  const genders = [
    { value: 'men', label: 'Men', icon: '👨' },
    { value: 'women', label: 'Women', icon: '👩' },
    { value: 'unisex', label: 'Unisex', icon: '👥', featured: true }
  ];

  // Barcode options
  const barcodeOptions = [
    { value: 'yes', label: 'Yes, has barcode', icon: '📱' },
    { value: 'no', label: 'No barcode', icon: '✋' }
  ];

  // Dynamic step generator
  function getStepsForCategory(category) {
    const baseSteps = [
      // Step 1: Category (always first)
      {
        type: 'cards',
        key: 'category',
        title: 'Clothing Category',
        subtitle: 'What type of clothing are you adding?',
        options: categories,
        columns: 'auto'
      }
    ];

    // Shoes flow
    if (category === 'shoes') {
      return baseSteps.concat([
        // Step 2: Shoe subtype
        {
          type: 'cards',
          key: 'shoe_subtype',
          title: 'Shoe Type',
          subtitle: 'Select the shoe type',
          options: shoeSubtypes,
          columns: 'auto'
        },
        // Step 3: Brand (conditional for sports/sneakers)
        {
          type: 'cards',
          key: 'brand',
          title: 'Brand',
          subtitle: 'Select the brand',
          options: sportsBrands,
          allowCustom: true,
          customPlaceholder: 'Enter brand',
          columns: 'auto'
        },
        // Step 4: Model (conditional for Jordan)
        {
          type: 'cards',
          key: 'model',
          title: 'Model',
          subtitle: 'Select the Jordan model',
          options: jordanModels,
          allowCustom: true,
          customPlaceholder: 'Enter model'
        }
      ]);
    }

    // Suits flow
    if (category === 'suits') {
      return baseSteps.concat([
        // Step 2: Suit subtype
        {
          type: 'cards',
          key: 'suit_subtype',
          title: 'Suit Type',
          subtitle: 'Select the suit type',
          options: suitSubtypes,
          columns: 'auto'
        },
        // Step 3: Fit (optional)
        {
          type: 'cards',
          key: 'fit',
          title: 'Fit',
          subtitle: 'Select the fit style',
          options: suitFits,
          skipable: true,
          columns: 'three-col'
        }
      ]);
    }

    // Jeans flow
    if (category === 'jeans') {
      return baseSteps.concat([
        // Step 2: Jeans type
        {
          type: 'cards',
          key: 'jeans_type',
          title: 'Jeans Type',
          subtitle: 'Select the jeans style',
          options: jeansTypes,
          columns: 'auto'
        },
        // Step 3: Color (optional)
        {
          type: 'cards',
          key: 'color',
          title: 'Color',
          subtitle: 'Select the color',
          options: colors,
          skipable: true,
          columns: 'auto'
        }
      ]);
    }

    // Default flow for other categories
    return baseSteps;
  }

  // Common final steps
  const commonFinalSteps = [
    // Size (Step 4)
    {
      type: 'cards',
      key: 'size',
      title: 'Size',
      subtitle: 'Select the size or enter custom (required)',
      options: (data) => {
        // Use numeric sizes for trousers/jeans, letter sizes for others
        if (['trousers', 'jeans'].includes(data.category)) {
          return numericSizes;
        }
        return sizes;
      },
      allowCustom: true,
      customPlaceholder: 'Enter custom size (e.g., "34", "41", "45", "XXXL")',
      skipable: false,
      columns: 'auto'
    },
    // Gender (Step 5)
    {
      type: 'cards',
      key: 'gender',
      title: 'Gender',
      subtitle: 'Who is this for?',
      options: genders,
      skipable: true,
      columns: 'three-col'
    },
    // REORDERED: Barcode selection comes BEFORE pricing
    {
      type: 'cards',
      key: 'has_barcode',
      title: 'Barcode',
      subtitle: 'Does this product have a barcode?',
      options: barcodeOptions,
      skipable: true,
      columns: 'two-col'
    },
    // REORDERED: Pricing comes AFTER barcode selection (always shown)
    {
      type: 'multi-input',
      key: 'pricing',
      title: 'Pricing & Stock',
      subtitle: 'Set prices and initial stock quantity',
      fields: [
        { key: 'product_name', label: 'Product Name (Optional)', type: 'text', placeholder: 'e.g., Air Jordan 1, Summer Dress', required: false },
        { key: 'selling_price', label: 'Selling Price (MWK)', type: 'number', min: 0, step: '0.01', required: true },
        { key: 'cost_price', label: 'Cost Price/Order Price (MWK)', type: 'number', min: 0, step: '0.01' },
        { key: 'initial_stock', label: 'Initial Stock Quantity', type: 'number', min: 1, value: 1, required: true }
      ]
    },
    // Smart Barcode Collection (conditional - only if has_barcode === 'yes')
    {
      type: 'custom',
      key: 'barcodes',
      title: 'Scan Barcodes',
      subtitle: 'Enter pricing and scan unique barcodes',
      skip: (data) => data.has_barcode !== 'yes',
      render: (data) => {
        const qty = parseInt(data.quantity || data.initial_stock || 0);
        const price = parseFloat(data.selling_price || 0);
        const cost = parseFloat(data.cost_price || 0);
        const scannedCount = (data.scanned_barcodes || []).length;
        const scannedBarcodes = data.scanned_barcodes || [];
        const isComplete = scannedCount >= qty;
        
        // Show inline pricing form if pricing not complete
        const pricingComplete = price > 0 && qty > 0;
        
        if (!pricingComplete) {
          return `
            <div class="wizard-pricing-form" style="background: linear-gradient(135deg, #f0f9ff, #e0f2fe); padding: 24px; border-radius: 16px; border: 2px solid #0ea5e9; margin-bottom: 20px;">
              <h3 style="margin: 0 0 16px; color: #0369a1; font-size: 1.1rem;">
                📦 Quantity & Pricing
              </h3>
              <p style="margin: 0 0 20px; color: #0c4a6e; font-size: 0.9rem;">
                First, enter the product details below. Then you'll scan barcodes.
              </p>
              
              <div style="display: grid; gap: 16px;">
                <div>
                  <label class="wizard-label" for="pricing-quantity">Initial Stock Quantity <span style="color: #dc2626;">*</span></label>
                  <input 
                    type="number" 
                    id="pricing-quantity" 
                    class="form-control" 
                    min="1" 
                    step="1" 
                    value="${qty || 1}"
                    placeholder="e.g., 5"
                    required
                  >
                  <small class="text-muted">Number of items to add to stock</small>
                </div>
                
                <div>
                  <label class="wizard-label" for="pricing-selling-price">Selling Price (MWK) <span style="color: #dc2626;">*</span></label>
                  <input 
                    type="number" 
                    id="pricing-selling-price" 
                    class="form-control" 
                    min="0" 
                    step="0.01" 
                    value="${price || ''}"
                    placeholder="e.g., 15000.00"
                    required
                  >
                  <small class="text-muted">Price per unit</small>
                </div>
                
                <div>
                  <label class="wizard-label" for="pricing-cost-price">Cost/Order Price (MWK)</label>
                  <input 
                    type="number" 
                    id="pricing-cost-price" 
                    class="form-control" 
                    min="0" 
                    step="0.01" 
                    value="${cost || ''}"
                    placeholder="e.g., 10000.00"
                  >
                  <small class="text-muted">Optional: Your cost per unit</small>
                </div>
                
                <div id="pricing-error" class="alert d-none"></div>
                
                <button 
                  type="button" 
                  class="btn btn-primary btn-lg w-100" 
                  onclick="savePricingAndContinue()"
                  style="background: linear-gradient(135deg, #0ea5e9, #0284c7); border: none; font-weight: 600;"
                >
                  Continue to Scan Barcodes →
                </button>
              </div>
            </div>
          `;
        }
        
        return `
          <div class="wizard-barcode-collection" id="wizard-barcode-collection">
            <!-- Progress Indicator -->
            <div class="wizard-barcode-progress mb-3">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="wizard-label">Progress</span>
                <span class="badge ${isComplete ? 'bg-success' : 'bg-primary'}">
                  Scanned ${scannedCount} / ${qty}
                </span>
              </div>
              <div class="progress" style="height: 8px;">
                <div class="progress-bar ${isComplete ? 'bg-success' : 'bg-primary'}" 
                     role="progressbar" 
                     style="width: ${Math.min(100, (scannedCount / qty) * 100)}%"
                     aria-valuenow="${scannedCount}" 
                     aria-valuemin="0" 
                     aria-valuemax="${qty}">
                </div>
              </div>
            </div>
            
            <!-- Scanned Barcodes List -->
            <div class="wizard-barcode-list mb-3" id="scanned-barcodes-list">
              ${scannedBarcodes.length > 0 ? `
                <label class="wizard-label mb-2">Scanned Barcodes:</label>
                <div class="list-group">
                  ${scannedBarcodes.map((code, idx) => `
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                      <code>${code}</code>
                      <button type="button" 
                              class="btn btn-sm btn-outline-danger" 
                              onclick="removeBarcode(${idx})"
                              title="Remove this barcode">
                        <i class="bi bi-x-lg"></i>
                      </button>
                    </div>
                  `).join('')}
                </div>
              ` : `
                <div class="text-muted text-center py-3">
                  <i class="bi bi-upc-scan" style="font-size: 2rem;"></i>
                  <p class="mt-2">No barcodes scanned yet</p>
                </div>
              `}
            </div>
            
            <!-- Scanner Controls -->
            <div class="wizard-barcode-controls">
              <button type="button" 
                      class="wizard-btn wizard-btn-primary w-100 mb-2" 
                      id="btn-scan-barcode"
                      onclick="openSmartBarcodeScanner()">
                <i class="bi bi-upc-scan me-2"></i>Scan Barcode
              </button>
              
              <!-- Manual Entry -->
              <div class="input-group mb-2">
                <input type="text" 
                       class="form-control" 
                       id="manual-barcode-input"
                       placeholder="Or type barcode manually..."
                       autocomplete="off">
                <button class="btn btn-outline-primary" 
                        type="button"
                        id="btn-add-manual-barcode"
                        onclick="addManualBarcode()">
                  <i class="bi bi-plus-lg"></i> Add
                </button>
              </div>
              
              <!-- Error Message -->
              <div class="alert alert-danger d-none" id="barcode-error" role="alert"></div>
              
              <!-- Continue Button (only enabled when complete) -->
              <button type="button" 
                      class="wizard-btn wizard-btn-success w-100 mt-3" 
                      id="barcode-continue-btn" 
                      onclick="wizard.next()"
                      ${isComplete ? '' : 'disabled'}>
                ${isComplete ? 'Continue <i class="bi bi-arrow-right ms-1"></i>' : `Scan ${qty - scannedCount} more barcode${qty - scannedCount > 1 ? 's' : ''} to continue`}
              </button>
            </div>
          </div>
        `;
      }
    }
  ];

  // Barcode Scanner Function (using existing scanner component)
  function openBarcodeScanner() {
    // Check if UnifiedScanner is available (from unified-scanner.js)
    if (typeof UnifiedScanner !== 'undefined') {
      const scanner = new UnifiedScanner({
        mode: 'barcode',
        onSelect: (barcode) => {
          const input = document.getElementById('input-barcode');
          if (input) {
            input.value = barcode;
            input.dispatchEvent(new Event('input'));
          }
        },
        onError: (error) => {
          alert('Scanner error: ' + error);
        }
      });
      scanner.open();
    } else {
      // Fallback: try simple camera access
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Camera access not available. Please type the barcode manually.');
        return;
      }
      
      // Simple camera modal (basic fallback)
      const modalHtml = `
        <div id="scanner-modal" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <video id="scanner-video" autoplay playsinline style="max-width:90%;max-height:70%;border-radius:12px;"></video>
          <button onclick="closeScannerModal()" style="margin-top:20px;padding:12px 24px;background:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;">Cancel</button>
          <p style="color:#fff;margin-top:12px;font-size:14px;">Note: Automatic scanning requires barcode scanner library. Please type barcode manually or install scanner.</p>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
      
      const video = document.getElementById('scanner-video');
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
          video.srcObject = stream;
        })
        .catch(err => {
          alert('Camera access denied: ' + err.message);
          closeScannerModal();
        });
    }
  }

  function closeScannerModal() {
    const modal = document.getElementById('scanner-modal');
    if (modal) {
      const video = document.getElementById('scanner-video');
      if (video && video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }
      modal.remove();
    }
  }

  // Initialize wizard with category step only
  let wizardSteps = [
    {
      type: 'cards',
      key: 'category',
      title: 'Clothing Category',
      subtitle: 'What type of clothing are you adding?',
      options: categories,
      columns: 'auto'
    }
  ];

  wizard = new WizardEngine('wizard-container', {
    steps: wizardSteps,
    
    onComplete: async (data) => {
      console.log('Clothing wizard complete:', data);
      
      // Show loading
      const loading = document.createElement('div');
      loading.className = 'wizard-loading';
      loading.innerHTML = '<div class="wizard-loading-spinner"></div><p style="color: #fff; margin-top: 12px;">Saving product...</p>';
      document.body.appendChild(loading);
      
      try {
        // Submit to server
        const csrfToken = document.querySelector('[name=csrf-token]')?.content || 
                          document.querySelector('[name=csrfmiddlewaretoken]')?.value;
        
        const response = await fetch('{% url "inventory:clothing_wizard_submit" %}', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
          },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
          // Success! Show success message
          loading.remove();
          const message = result.message || 'Product saved successfully!';
          showSuccessBanner(message + ' Redirecting...');
          
          // Redirect after brief delay
          setTimeout(() => {
            window.location.href = result.redirect || '{% url "verticals:clothing_dashboard" %}';
          }, 1500);
        } else {
          loading.remove();
          showErrorBanner(result.error || 'Failed to create product');
        }
      } catch (error) {
        loading.remove();
        console.error('Submit error:', error);
        showErrorBanner('Failed to create product. Please try again.');
      }
    },
    
    onCancel: () => {
      if (confirm('Cancel adding clothing?')) {
        window.location.href = '{% url "verticals:clothing_dashboard" %}';
      }
    }
  });

  // Success/Error banner helpers
  function showSuccessBanner(message) {
    const banner = document.createElement('div');
    banner.className = 'wizard-banner wizard-banner-success';
    banner.innerHTML = `
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 24px;">✅</span>
        <span style="font-weight: 600;">${message}</span>
      </div>
    `;
    document.body.appendChild(banner);
    
    setTimeout(() => {
      banner.classList.add('show');
    }, 100);
    
    setTimeout(() => {
      banner.classList.remove('show');
      setTimeout(() => banner.remove(), 300);
    }, 3000);
  }
  
  function showErrorBanner(message) {
    const banner = document.createElement('div');
    banner.className = 'wizard-banner wizard-banner-error';
    banner.innerHTML = `
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 24px;">❌</span>
        <span style="font-weight: 600;">${message}</span>
      </div>
    `;
    document.body.appendChild(banner);
    
    setTimeout(() => {
      banner.classList.add('show');
    }, 100);
  }

  // Override next() to rebuild steps dynamically
  const originalNext = wizard.next.bind(wizard);
  wizard.next = function() {
    // If we just selected category, rebuild the wizard steps
    if (this.currentStep === 0 && this.data.category) {
      const categorySteps = getStepsForCategory(this.data.category);
      this.config.steps = [...categorySteps, ...commonFinalSteps];
    }
    originalNext();
  };
  
  // Override selectCard to enforce single selection and auto-open scanner when needed
  const originalSelectCard = wizard.selectCard.bind(wizard);
  wizard.selectCard = function(key, value, index) {
    // CRITICAL FIX: Enforce single selection for all card-based steps
    // Deselect all other cards for this key before selecting the new one
    if (this.data[key] !== undefined && this.data[key] !== value) {
      // Clear the previous selection to enforce single selection
      delete this.data[key];
    }
    
    // Call original selectCard which sets the new value
    originalSelectCard(key, value, index);
    
    // Visual enforcement: remove 'selected' class from all sibling cards
    const allCards = document.querySelectorAll(`[data-key="${key}"]`);
    allCards.forEach(card => {
      if (card.dataset.value !== value) {
        card.classList.remove('wizard-card-selected');
      }
    });
    
    // If user selects "No" for barcode, skip barcode input step entirely
    if (key === 'has_barcode' && value === 'no') {
      // Clear any barcode data
      delete this.data.barcode;
      delete this.data.barcodes;
      delete this.data.scanned_barcodes;
      // Move to next step after has_barcode (skip barcode collection)
      setTimeout(() => {
        this.next();
      }, 300);
    }
    
    // If user selects "Yes" for barcode, auto-open scanner on next step
    if (key === 'has_barcode' && value === 'yes') {
      setTimeout(() => {
        this.next(); // Move to barcode collection step
        setTimeout(() => {
          // Scanner should auto-open on the barcode step
          const scanBtn = document.getElementById('btn-scan-barcode');
          if (scanBtn) {
            // Don't auto-open scanner, let user click when ready
            // Just focus on the manual input as fallback
            const manualInput = document.getElementById('manual-barcode-input');
            if (manualInput) {
              manualInput.focus();
            }
          }
        }, 400); // Small delay to let the step render
      }, 300);
    }
  };
  
  // Add submitBarcodeInput method to wizard (legacy, for single barcode)
  wizard.submitBarcodeInput = function() {
    const barcodeInput = document.getElementById('input-barcode');
    if (barcodeInput && barcodeInput.value.trim()) {
      this.data.barcode = barcodeInput.value.trim();
      this.next();
    } else {
      alert('Please enter or scan a barcode to continue.');
    }
  };
  
  // =====================================================
  // SMART BARCODE COLLECTION (Quantity-based)
  // =====================================================
  
  // Initialize scanned barcodes array if not exists
  if (!wizard.data.scanned_barcodes) {
    wizard.data.scanned_barcodes = [];
  }
  
  // Open smart barcode scanner
  function openSmartBarcodeScanner() {
    // Check if RearCameraBarcodeScanner is available
    if (typeof RearCameraBarcodeScanner !== 'undefined') {
      const scanner = new RearCameraBarcodeScanner({
        onScan: (barcode) => {
          addBarcode(barcode);
        },
        onError: (error) => {
          showBarcodeError('Scanner error: ' + error);
        }
      });
      scanner.open();
    } else {
      // Fallback: use manual input
      const input = document.getElementById('manual-barcode-input');
      if (input) {
        input.focus();
        showBarcodeError('Scanner not available. Please enter barcode manually.');
      }
    }
  }
  
  // Add barcode (from scanner or manual input)
  async function addBarcode(barcode) {
    if (!barcode || !barcode.trim()) {
      showBarcodeError('Barcode cannot be empty');
      return;
    }
    
    barcode = barcode.trim();
    const scannedBarcodes = wizard.data.scanned_barcodes || [];
    const qty = parseInt(wizard.data.quantity || wizard.data.initial_stock || 1);
    
    // Check if already scanned in current list
    if (scannedBarcodes.includes(barcode)) {
      showBarcodeError(`Barcode ${barcode} has already been scanned. Please scan a different barcode.`);
      return;
    }
    
    // Check if we've reached the limit
    if (scannedBarcodes.length >= qty) {
      showBarcodeError(`You have already scanned ${qty} barcodes. Remove one to add another.`);
      return;
    }
    
    // Validate barcode format (basic check)
    if (barcode.length < 3) {
      showBarcodeError('Barcode must be at least 3 characters long');
      return;
    }
    
    // Check for duplicate in database (async)
    showBarcodeError('Checking barcode...'); // Show loading message
    try {
      const csrfToken = document.querySelector('[name=csrf-token]')?.content || 
                        document.querySelector('[name=csrfmiddlewaretoken]')?.value;
      
      const response = await fetch('{% url "inventory:check_barcode_duplicate" %}', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': csrfToken
        },
        body: JSON.stringify({ barcode: barcode })
      });
      
      if (response.ok) {
        const result = await response.json();
        if (result.exists) {
          showBarcodeError(`Barcode ${barcode} is already used by another product: ${result.product_name}. Please use a unique barcode.`);
          return;
        }
      }
    } catch (error) {
      console.warn('Could not check barcode duplicate:', error);
      // Continue anyway - backend will validate again on submit
    }
    
    clearBarcodeError(); // Clear "Checking..." message
    
    // Add to array
    scannedBarcodes.push(barcode);
    wizard.data.scanned_barcodes = scannedBarcodes;
    
    // Clear manual input
    const manualInput = document.getElementById('manual-barcode-input');
    if (manualInput) {
      manualInput.value = '';
    }
    
    // Re-render the step to update UI
    wizard.render();
    
    // Show success feedback
    const successMsg = document.createElement('div');
    successMsg.className = 'alert alert-success';
    successMsg.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 9999; animation: fadeIn 0.3s;';
    successMsg.textContent = `✓ Barcode ${barcode} added`;
    document.body.appendChild(successMsg);
    setTimeout(() => successMsg.remove(), 2000);
  }
  
  // Add manual barcode
  function addManualBarcode() {
    const input = document.getElementById('manual-barcode-input');
    if (input && input.value.trim()) {
      addBarcode(input.value.trim());
    } else {
      showBarcodeError('Please enter a barcode');
    }
  }
  
  // Remove barcode
  function removeBarcode(index) {
    const scannedBarcodes = wizard.data.scanned_barcodes || [];
    if (index >= 0 && index < scannedBarcodes.length) {
      scannedBarcodes.splice(index, 1);
      wizard.data.scanned_barcodes = scannedBarcodes;
      wizard.render();
      clearBarcodeError();
    }
  }
  
  // Show barcode error
  function showBarcodeError(message) {
    const errorDiv = document.getElementById('barcode-error');
    if (errorDiv) {
      errorDiv.textContent = message;
      errorDiv.classList.remove('d-none');
      // Auto-hide after 5 seconds
      setTimeout(() => {
        clearBarcodeError();
      }, 5000);
    }
  }
  
  // Clear barcode error
  function clearBarcodeError() {
    const errorDiv = document.getElementById('barcode-error');
    if (errorDiv) {
      errorDiv.classList.add('d-none');
      errorDiv.textContent = '';
    }
  }
  
  // Override wizard.onComplete to include barcodes in submission
  const originalOnComplete = wizard.config.onComplete;
  wizard.config.onComplete = async function(data) {
    // If barcodes were collected, include them in the data
    if (data.has_barcode === 'yes' && data.scanned_barcodes) {
      // For single barcode, use the first one
      if (data.scanned_barcodes.length === 1) {
        data.barcode = data.scanned_barcodes[0];
      } else {
        // For multiple barcodes, store as array
        data.barcodes = data.scanned_barcodes;
        data.barcode = data.scanned_barcodes[0]; // Also set first for backward compatibility
      }
    }
    
    // Call original onComplete
    if (originalOnComplete) {
      return originalOnComplete(data);
    }
  };
  
  // Save pricing and continue to scanning
  window.savePricingAndContinue = function() {
    const qtyInput = document.getElementById('pricing-quantity');
    const priceInput = document.getElementById('pricing-selling-price');
    const costInput = document.getElementById('pricing-cost-price');
    const errorDiv = document.getElementById('pricing-error');
    
    // Get values
    const qty = parseInt(qtyInput?.value || 0);
    const price = parseFloat(priceInput?.value || 0);
    const cost = parseFloat(costInput?.value || 0);
    
    // Validate (BLOCKING errors only)
    if (!qty || qty <= 0) {
      errorDiv.textContent = '❌ Please enter a valid quantity (must be greater than 0)';
      errorDiv.classList.remove('d-none');
      errorDiv.classList.remove('alert-warning');
      errorDiv.classList.add('alert-danger');
      qtyInput?.focus();
      return;
    }
    
    if (!price || price <= 0) {
      errorDiv.textContent = '❌ Please enter a valid selling price (must be greater than 0)';
      errorDiv.classList.remove('d-none');
      errorDiv.classList.remove('alert-warning');
      errorDiv.classList.add('alert-danger');
      priceInput?.focus();
      return;
    }
    
    if (cost < 0) {
      errorDiv.textContent = '❌ Cost price cannot be negative';
      errorDiv.classList.remove('d-none');
      errorDiv.classList.remove('alert-warning');
      errorDiv.classList.add('alert-danger');
      costInput?.focus();
      return;
    }
    
    // NON-BLOCKING: Smart pricing warnings
    let hasWarning = false;
    if (cost > 0 && price < cost) {
      const suggestedPrice = (cost * 1.2).toFixed(2);
      errorDiv.textContent = `⚠️ Warning: Selling price (K${price.toFixed(0)}) is below cost (K${cost.toFixed(0)}). You're pricing at a loss. Consider K${suggestedPrice} for 20% markup. Click Continue to proceed anyway.`;
      errorDiv.classList.remove('d-none');
      errorDiv.classList.remove('alert-danger');
      errorDiv.classList.add('alert-warning');
      hasWarning = true;
      // Don't return - allow user to continue
    } else {
      // Clear warnings if pricing is good
      errorDiv.classList.add('d-none');
      errorDiv.textContent = '';
    }
    
    // Save to wizard data
    wizard.data.initial_stock = qty;
    wizard.data.quantity = qty;
    wizard.data.selling_price = price.toFixed(2);
    if (cost > 0) {
      wizard.data.cost_price = cost.toFixed(2);
    }
    
    // Re-render to show scanning UI
    wizard.render();
  };
  
  // Allow Enter key in manual input
  document.addEventListener('DOMContentLoaded', function() {
    // This will be called when the barcode step is rendered
    setTimeout(() => {
      const manualInput = document.getElementById('manual-barcode-input');
      if (manualInput) {
        manualInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            addManualBarcode();
          }
        });
      }
    }, 100);
  });
})();
</script>
{% endblock %}
