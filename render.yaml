services:
  # ---------------------------------------------------------------------------
  # Static media CDN service
  # ---------------------------------------------------------------------------
  # Render serves this directory through Cloudflare's edge CDN.
  # Videos are streamed directly by Cloudflare — Gunicorn is NEVER invoked.
  # URL: https://emajinet-videos.onrender.com/<filename>
  # The web service reads VIDEO_BASE_URL and the landing page <video> tag uses
  # this absolute URL so the browser fetches the MP4 straight from the CDN.
  - type: static
    name: emajinet-videos
    staticPublishPath: static/videos
    headers:
      - path: /*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /*
        name: Accept-Ranges
        value: bytes

  # ---------------------------------------------------------------------------
  # Main Django/Gunicorn web service
  # ---------------------------------------------------------------------------
  - type: web
    name: circuitcity-main
    env: python
    plan: starter
    autoDeploy: true

    # Single-line build; '&&' keeps steps separate even if Render flattens.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && (python manage.py collectstatic --noinput || true) && (python manage.py migrate --noinput || true)

    # Run via bash -lc to avoid the single-quote EOF issue.
    startCommand: bash -lc "exec gunicorn cc.wsgi:application --preload --workers=$WEB_CONCURRENCY --timeout 120 --bind 0.0.0.0:$PORT"

    healthCheckPath: /healthz/

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DJANGO_SETTINGS_MODULE
        value: cc.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: USE_LOCAL_SQLITE
        value: "0"
      - key: REQUIRE_DATABASE_URL
        value: "1"
      - key: HEALTHZ_ALLOW_HTTP
        value: "1"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: WEB_CONCURRENCY
        value: "3"
      # Point the landing page <video> tag to the CDN static site above so
      # Gunicorn never serves the MP4.  The URL matches the static service name.
      - key: VIDEO_BASE_URL
        value: "https://emajinet-videos.onrender.com"

      - key: DATABASE_URL
        fromDatabase:
          name: circuitcity-db
          property: connectionString

databases:
  - name: circuitcity-db
    plan: free
