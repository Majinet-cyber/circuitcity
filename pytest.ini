[pytest]
DJANGO_SETTINGS_MODULE = cc.settings
python_files = test_*.py
testpaths =
    sales/tests
    inventory/tests
    tenants/tests
    core/tests
    reports/tests
    tests
norecursedirs =
    .git
    .venv
    venv
    node_modules
    scripts
    static
    media
    _dup_backup
    backups
    tmp
    .pytest_cache
addopts = -q
markers =
    e2e: End-to-end tests requiring browser/Playwright (deselect with -m "not e2e")
    smoke: Smoke tests for core workflows (often use Playwright)
    lint: Linting/template validation tests
