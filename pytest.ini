[pytest]
DJANGO_SETTINGS_MODULE = cc.settings
python_files = test_*.py
testpaths =
    tests/critical
    sales/tests
    inventory/tests
    tenants/tests
    core/tests
    reports/tests
    tests
norecursedirs =
    .git
    .venv
    venv
    node_modules
    scripts
    static
    media
    _dup_backup
    backups
    tmp
    .pytest_cache
addopts = -q --strict-markers --strict-config
markers =
    critical: MUST-PASS reliability gate - blocks deployment if failing (run with: pytest -m critical)
    otp: OTP verification tests (run with: pytest -m "critical and otp")
    slow: Tests that take > 5 seconds
    flaky: Nondeterministic tests in temporary quarantine (excluded from critical)
    e2e: End-to-end tests requiring browser/Playwright (deselect with -m "not e2e")
    smoke: Smoke tests for core workflows (often use Playwright)
    lint: Linting/template validation tests
filterwarnings =
    error
    # Allow deprecation warnings from third-party libraries
    ignore::DeprecationWarning:reportlab.*
    ignore::DeprecationWarning:anymail.*
    # Django 6.0 deprecations (will be fixed before upgrade)
    ignore:CheckConstraint.check is deprecated:django.utils.deprecation.RemovedInDjango60Warning
