<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" fill="none">
  <!-- Car body -->
  <rect x="8" y="28" width="104" height="22" rx="4" fill="#16a34a"/>
  <!-- Car roof / cabin -->
  <path d="M32 28 L44 14 L76 14 L88 28 Z" fill="#15803d"/>
  <!-- Windshield front -->
  <path d="M74 14 L86 28 L72 28 Z" fill="#bbf7d0" opacity="0.8"/>
  <!-- Windshield rear -->
  <path d="M46 14 L34 28 L48 28 Z" fill="#bbf7d0" opacity="0.8"/>
  <!-- Window middle -->
  <rect x="50" y="15" width="20" height="13" rx="2" fill="#bbf7d0" opacity="0.8"/>
  <!-- Front bumper -->
  <rect x="106" y="32" width="6" height="10" rx="2" fill="#15803d"/>
  <!-- Rear bumper -->
  <rect x="8" y="32" width="6" height="10" rx="2" fill="#15803d"/>
  <!-- Headlight front -->
  <rect x="108" y="34" width="4" height="5" rx="1" fill="#fef08a"/>
  <!-- Taillight rear -->
  <rect x="8" y="34" width="4" height="5" rx="1" fill="#fca5a5"/>
  <!-- Door line -->
  <line x1="60" y1="29" x2="60" y2="49" stroke="#15803d" stroke-width="1.5"/>
  <!-- Wheel rear -->
  <circle cx="30" cy="50" r="8" fill="#1e293b"/>
  <circle cx="30" cy="50" r="4" fill="#94a3b8"/>
  <circle cx="30" cy="50" r="1.5" fill="#475569"/>
  <!-- Wheel front -->
  <circle cx="90" cy="50" r="8" fill="#1e293b"/>
  <circle cx="90" cy="50" r="4" fill="#94a3b8"/>
  <circle cx="90" cy="50" r="1.5" fill="#475569"/>
  <!-- Ground shadow -->
  <ellipse cx="60" cy="58" rx="50" ry="3" fill="#000" opacity="0.1"/>
</svg>